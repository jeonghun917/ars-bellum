<!DOCTYPE html>
<html lang="ko">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Ars Bellum (아르스 벨룸)</title>
 <link rel="stylesheet" href="style.css">
 <style>
 /* CSS 스타일 유지 */
 #main-menu { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(135deg, #1e272e 0%, #0f171e 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: #fff; font-family: sans-serif; }
 #main-menu h1 { font-size: 3rem; letter-spacing: 4px; margin-bottom: 10px; color: #f1c40f; text-shadow: 0 0 15px rgba(241, 196, 15, 0.4); }
 #main-menu p { font-size: 1.1rem; color: #b2bec3; margin-bottom: 40px; }
 .menu-btn-group { display: flex; flex-direction: column; gap: 15px; width: 280px; }
 .menu-btn { padding: 16px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: #fff; transition: 0.2s; }
 .menu-btn:hover { filter: brightness(1.2); transform: scale(1.02); }
 .btn-practice { background: #27ae60; } .btn-maingame { background: #2980b9; } .btn-worldmap { background: #8e44ad; }
 
 body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; }
 button { cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
 #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100; }
 .interactive { pointer-events: auto; }
 
 /* 경제창 UI (전투 화면 좌측 상단) */
 #economyUI { position: absolute; top: 15px; left: 15px; background: rgba(20, 25, 30, 0.9); padding: 10px 15px; border-radius: 8px; border: 1px solid #f1c40f; display: flex; gap: 15px; color: #fff; font-weight: bold; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
 
 #topRightUI { position: absolute; top: 15px; right: 15px; display: flex; align-items: center; gap: 10px; }
 .control-group { display: flex; gap: 5px; }
 .control-group button { background: rgba(30, 35, 40, 0.85); color: white; padding: 6px 10px; font-size: 13px; border: 1px solid rgba(255,255,255,0.2); }
 .dropdown { position: relative; display: inline-block; }
 .dropdown-content { display: none; position: absolute; right: 0; background-color: rgba(30, 30, 30, 0.95); min-width: 80px; box-shadow: 0px 8px 16px rgba(0,0,0,0.5); border-radius: 5px; overflow: hidden; margin-top: 5px; }
 .dropdown-content.show { display: block; }
 .dropdown-content button { width: 100%; background: transparent; color: white; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); border-radius: 0; }
 #btnMenuToggle { background: rgba(0, 0, 0, 0.6); color: white; font-size: 18px; padding: 4px 10px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
 
 #menuModal { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.8); z-index: 999; flex-direction: column; align-items: center; padding-top: 80px; }
 #menuModal.active { display: flex; pointer-events: auto; }
 .modal-btn { background: #444; color: white; padding: 15px 40px; margin-bottom: 10px; font-size: 18px; width: 200px; border: 2px solid #666; }

 #diplomacyModal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 400px; background: rgba(20, 25, 30, 0.95); border: 2px solid #c0392b; border-radius: 8px; z-index: 1000; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
 #diplomacyModal.active { display: flex; pointer-events: auto; }
 .diplo-header { background: #c0392b; color: white; padding: 10px; font-weight: bold; font-size: 16px; border-top-left-radius: 6px; border-top-right-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
 .diplo-body { padding: 15px; color: #ddd; font-size: 14px; min-height: 100px; max-height: 250px; overflow-y: auto; line-height: 1.5; }
 .lord-msg { background: rgba(255,255,255,0.1); padding: 10px; border-left: 4px solid #f1c40f; margin-bottom: 10px; border-radius: 4px; }
 .player-msg { background: rgba(41, 128, 185, 0.3); padding: 10px; border-right: 4px solid #3498db; margin-bottom: 10px; border-radius: 4px; text-align: right; }
 .diplo-footer { display: flex; padding: 10px; gap: 10px; border-top: 1px solid #444; }
 .diplo-input { flex: 1; padding: 8px; border-radius: 4px; border: none; background: #111; color: white; }
 .diplo-send-btn { padding: 8px 15px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
 .close-btn { background: transparent; border: none; color: white; font-size: 16px; cursor: pointer; }

 #bottomUI { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 96%; max-width: 500px; display: flex; flex-direction: column; align-items: center; }
 #subCategoryPanel { display: none; margin-bottom: 6px; background: rgba(40, 45, 50, 0.95); padding: 6px; border-radius: 6px; border: 1px solid #555; }
 #subCategoryPanel.active { display: flex; gap: 4px; overflow-x: auto; max-width: 100%; }
 .bottom-main-bar { display: flex; width: 100%; background: rgba(20, 25, 30, 0.85); backdrop-filter: blur(4px); border-radius: 6px; padding: 6px 10px; border: 1px solid rgba(255,255,255,0.15); gap: 8px; align-items: center; justify-content: flex-start; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
 .bottom-main-bar::-webkit-scrollbar { display: none; }
 .ui-group { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
 .ui-label { color: #888; font-size: 11px; margin-right: 2px; font-weight: bold; }
 .btn { padding: 8px 10px; font-size: 12px; border-radius: 4px; color: white; background: #555; transition: 0.1s; flex-shrink: 0; }
 .btn:active { transform: scale(0.95); }
 .btn.active { background: #2980b9; } 
 .btn-spawn { background: #444; } .btn-cmd { background: #d35400; } .btn-green { background: #27ae60; } .btn-danger { background: #c0392b; } .btn-attack { background: #8e44ad; }
 </style>
</head>
<body>

 <!-- 1️⃣ 메인 메뉴 -->
 <div id="main-menu" class="interactive">
 <h1>ARS BELLUM</h1>
 <p>전술 리얼타임 시뮬레이터</p>
 <div class="menu-btn-group">
 <button id="btn-practice-mode" class="menu-btn btn-practice">🎲 연습장</button>
 <button id="btn-main-game-mode" class="menu-btn btn-maingame">🏰 본게임</button>
 <button class="menu-btn btn-worldmap" onclick="startWorldMapMode()">🌍 테네브리스 월드맵</button>
 </div>
 </div>

 <!-- 2️⃣ 실제 지도 형태의 월드맵 레이어 (오류 수정됨) -->
 <div id="world-map-layer" style="display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f1318; z-index: 500;" class="interactive">
 <!-- 지도 렌더링 캔버스 -->
 <canvas id="worldCanvas" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;"></canvas>

 <!-- 우측 상단 미니 HUD -->
 <div style="position: absolute; top: 20px; right: 20px; background: rgba(20, 25, 30, 0.9); padding: 15px 20px; border-radius: 8px; border: 1px solid #f1c40f; color: #fff; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.8);">
 <div style="font-weight: bold; margin-bottom: 8px; color: #f1c40f; border-bottom: 1px solid #444; padding-bottom: 5px;">이름 없는 방랑자</div>
 <div>💰 소지금: <span id="mapGold" style="color: #f1c40f;">0</span> 솔리두스</div>
 <div>🌾 식량: <span id="mapFood" style="color: #2ecc71;">0</span>일 치</div>
 <div>🎒 짐말: 장착됨 (+무게 여유)</div>
 </div>

 <button onclick="exitWorldMap()" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 25px; font-size: 16px; background: #c0392b; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">메인으로 돌아가기</button>
 </div>
 
 <!-- 3️⃣ 전투 맵 캔버스 -->
 <div id="game-container"><canvas id="battlefield"></canvas></div>
 
 <!-- 4️⃣ 인게임 전투 UI 레이어 -->
 <div id="ui-layer" style="display: none;">
 
 <!-- 게임 내 실시간 자원 표시 (복구됨!) -->
 <div id="economyUI" class="interactive">
 <div>💰 <span id="econ-gold" style="color: #f1c40f;">0</span></div>
 <div>🌾 <span id="econ-food" style="color: #2ecc71;">0</span></div>
 <div>👥 <span id="econ-manpower" style="color: #3498db;">0</span></div>
 <div>🚩 <span id="econ-territory" style="color: #e74c3c;">0</span></div>
 </div>

 <div id="prepUI" class="interactive" style="position:absolute; top:80px; left:50%; transform:translateX(-50%); text-align:center; z-index:200;">
 <div style="background:rgba(192, 57, 43, 0.9); padding:10px 20px; border-radius:8px; color:white; font-weight:bold; font-size:18px; margin-bottom:10px;">전력 배치 및 준비 단계</div>
 <button onclick="startBattle()" style="padding:15px 30px; font-size:20px; background:#f1c40f; color:#111; border:none; border-radius:8px; cursor:pointer; font-weight:bold; box-shadow:0 4px 10px rgba(0,0,0,0.5);">⚔️ 전투 시작</button>
 </div>

 <div id="topRightUI" class="interactive">
 <div class="control-group">
 <button id="btn-speed1" onclick="gameManager.setTimeScale(1)">1배속</button>
 <button id="btn-speed0" onclick="gameManager.setTimeScale(0)">일시정지</button>
 <button id="btn-speed2" onclick="gameManager.setTimeScale(2)">2배속</button>
 <div class="dropdown">
 <button class="dropbtn">기타 ▼</button>
 <div class="dropdown-content">
 <button id="btnNegotiate" onclick="openDiplomacy('negotiate')">협상</button>
 <button id="btnRetreat" onclick="executeRetreat()">퇴각</button>
 <button id="btnSurrender" onclick="executeSurrender()">항복</button>
 </div>
 </div>
 </div>
 <button id="btnMenuToggle">⋮</button>
 </div>
 
 <div id="menuModal" class="interactive">
 <button class="modal-btn" id="btnSave">저장</button>
 <button class="modal-btn" onclick="returnToMainMenu()">홈화면</button>
 </div>

 <div id="diplomacyModal" class="interactive">
 <div class="diplo-header">
 <span id="diploTitle">적 영주와의 서신</span>
 <button class="close-btn" onclick="closeDiplomacy()">✖</button>
 </div>
 <div class="diplo-body" id="diploChatBox">
 <div class="lord-msg">"감히 내 영지에 발을 들이다니, 목숨이 아깝지 않은 모양이군. 할 말이 있다면 들어나 보겠다."</div>
 </div>
 <div class="diplo-footer">
 <input type="text" id="diploInput" class="diplo-input" placeholder="조건을 입력하세요...">
 <button class="diplo-send-btn" onclick="sendDiplomacyMsg()">전송</button>
 </div>
 </div>
 
 <div id="bottomUI" class="interactive">
 <div id="subCategoryPanel">
 <div class="ui-group" id="unitList"></div>
 </div>
 
 <div class="bottom-main-bar" id="spawn-bar">
 <div class="ui-group">
 <span class="ui-label">호출</span>
 <button class="btn btn-spawn tab-btn" data-type="infantry">🛡️ 보병</button>
 <button class="btn btn-spawn tab-btn" data-type="cavalry">🐎 기병</button>
 <button class="btn btn-spawn tab-btn" data-type="archer">🏹 궁병</button>
 </div>
 </div>

 <div class="bottom-main-bar" id="command-bar" style="display: none;">
 <div class="ui-group" id="skill-panel">
 <span class="ui-label">명령</span>
 <button id="btn-attack" class="btn btn-attack" onclick="setCommandMode('attack')">⚔️ 공격</button>
 <button id="btn-direction" class="btn btn-cmd" onclick="setCommandMode('direction')">🔄 방향</button>
 <button id="btn-formation" class="btn btn-green" onclick="openFormationPanel()">❖ 진형</button>
 <button id="btn-waypoint" class="btn btn-cmd" onclick="toggleWaypointMode()">📍 경로예약</button>
 <button id="btn-clear-wp" class="btn btn-danger" onclick="clearWaypoints()">🛑 중단</button>
 <button id="btnDeselect" class="btn btn-danger" onclick="deselectAllUI()">❌ 해제</button>
 </div>
 </div>

 <div class="bottom-main-bar" id="formation-bar" style="display: none;">
 <div class="ui-group">
 <span class="ui-label">진형선택</span>
 <button class="btn btn-green" onclick="setFormation('line')">➖ 횡대</button>
 <button class="btn btn-green" onclick="setFormation('column')">▤ 종대</button>
 <button class="btn btn-green" onclick="setFormation('square')">▣ 방진</button>
 <button class="btn btn-green" onclick="setFormation('special')">⭐ 특수</button>
 <button class="btn btn-cmd" onclick="setFormation('loose')">✖ 산개(해제)</button>
 <button class="btn btn-danger" onclick="closeFormationPanel()">◀ 닫기</button>
 </div>
 </div>
 </div>
 </div>

 <!-- main.js 에러 방지용 더미 버튼 -->
 <div style="display: none !important;">
 <button id="btn-special"></button>
 <button id="btn-loose"></button>
 </div>

 <!-- 💡 모든 자바스크립트는 여기서부터 시작됩니다 -->
 <script>
 // [내정 및 경제 시스템]
 window.playerEconomy = {
     gold: 500, // 가난한 시작
     food: 10,
     manpower: 0,
     territory: 0
 };

 window.updateEconUI = function() {
     let goldEl = document.getElementById('econ-gold');
     if(goldEl) goldEl.innerText = window.playerEconomy.gold;
     let foodEl = document.getElementById('econ-food');
     if(foodEl) foodEl.innerText = window.playerEconomy.food;
     let manEl = document.getElementById('econ-manpower');
     if(manEl) manEl.innerText = window.playerEconomy.manpower;
     let terrEl = document.getElementById('econ-territory');
     if(terrEl) terrEl.innerText = window.playerEconomy.territory;
 };

 window.saveEconomy = function() {
     localStorage.setItem('ars_bellum_econ', JSON.stringify(window.playerEconomy));
     window.updateEconUI();
 };

 window.loadEconomy = function() {
     let saved = localStorage.getItem('ars_bellum_econ');
     if (saved) {
         window.playerEconomy = JSON.parse(saved);
     }
     window.updateEconUI();
 };

 window.onload = function() {
     window.loadEconomy();
 };

 // [월드맵 제어 시스템]
 window.startWorldMapMode = function() {
     document.getElementById('main-menu').style.display = 'none';
     document.getElementById('game-container').style.display = 'none';
     document.getElementById('ui-layer').style.display = 'none';
     
     document.getElementById('world-map-layer').style.display = 'block';
     
     window.loadEconomy();
     document.getElementById('mapGold').innerText = window.playerEconomy.gold;
     document.getElementById('mapFood').innerText = window.playerEconomy.food;

     // Campaign.js에 선언된 캔버스 엔진 실행
     if (window.initWorldMapCanvas) {
         window.initWorldMapCanvas(); 
     } else {
         console.error("Campaign.js 파일이 연결되지 않았습니다.");
     }
 };

 window.exitWorldMap = function() {
     document.getElementById('world-map-layer').style.display = 'none';
     document.getElementById('game-container').style.display = 'block'; 
     document.getElementById('main-menu').style.display = 'flex';
 };

 // [전투 UI 제어 시스템]
 window.isPreparationPhase = true;
 window.isGameOver = false;
 window.startBattle = function() {
     window.isPreparationPhase = false;
     document.getElementById('prepUI').style.display = 'none';
 };

 const dropbtn = document.querySelector('.dropbtn');
 const dropdownContent = document.querySelector('.dropdown-content');
 if (dropbtn) {
     dropbtn.addEventListener('click', (e) => { e.stopPropagation(); dropdownContent.classList.toggle('show'); });
     window.addEventListener('click', () => { if (dropdownContent.classList.contains('show')) dropdownContent.classList.remove('show'); });
 }

 const btnMenuToggle = document.getElementById('btnMenuToggle');
 const menuModal = document.getElementById('menuModal');
 if (btnMenuToggle) {
     btnMenuToggle.addEventListener('click', () => menuModal.classList.toggle('active'));
     menuModal.addEventListener('click', (e) => { if (e.target === menuModal) menuModal.classList.remove('active'); });
 }

 const tabBtns = document.querySelectorAll('.tab-btn');
 const subCategoryPanel = document.getElementById('subCategoryPanel');
 const unitList = document.getElementById('unitList');
 const spawnBar = document.getElementById('spawn-bar');
 const commandBar = document.getElementById('command-bar');
 const formationBar = document.getElementById('formation-bar');

 const unitData = {
     infantry: [{name:'방패', id:'shield'}, {name:'충격', id:'shock'}, {name:'장창', id:'pike'}],
     cavalry: [{name:'중기병', id:'heavy_cav'}, {name:'경기병', id:'light_cav'}],
     archer: [{name:'장궁', id:'archer'}, {name:'석궁', id:'crossbow'}]
 };

 window.currentCommandMode = 'move'; 
 window.setCommandMode = function(mode) {
     window.currentCommandMode = mode;
     document.getElementById('btn-attack').classList.remove('active');
     document.getElementById('btn-direction').classList.remove('active');
     document.getElementById('btn-waypoint').classList.remove('active');
     
     if (mode === 'attack') document.getElementById('btn-attack').classList.add('active');
     else if (mode === 'direction') document.getElementById('btn-direction').classList.add('active');
     else if (mode === 'move') document.getElementById('btn-waypoint').classList.add('active');
 };

 let currentUIState = 'spawn';
 window.updateUISelectionState = function(isSelected) {
     if (isSelected && currentUIState !== 'command') {
         currentUIState = 'command';
         spawnBar.style.display = 'none'; 
         commandBar.style.display = 'flex';
         formationBar.style.display = 'none'; 
         subCategoryPanel.classList.remove('active'); tabBtns.forEach(b => b.classList.remove('active'));
         setCommandMode('move'); 
     } else if (!isSelected && currentUIState !== 'spawn') {
         currentUIState = 'spawn';
         spawnBar.style.display = 'flex'; 
         commandBar.style.display = 'none';
         formationBar.style.display = 'none';
     }
 };

 window.openFormationPanel = function() {
     commandBar.style.display = 'none';
     formationBar.style.display = 'flex';
 };
 window.closeFormationPanel = function() {
     formationBar.style.display = 'none';
     commandBar.style.display = 'flex';
 };
 
 window.setFormation = function(formType) {
     if (!window.currentSquads) return;
     window.currentSquads.forEach(sq => {
         if (sq.selected && sq.team === 'ally') {
             if (formType === 'special') sq.currentFormation = sq.specialFormation;
             else sq.currentFormation = formType;
             if (sq.waypoints.length === 0 && sq.state !== 'combat') {
                 sq.waypoints = [{x: sq.centerX, y: sq.centerY}];
             }
         }
     });
     closeFormationPanel();
 };

 tabBtns.forEach(btn => {
     btn.addEventListener('click', () => {
         if (btn.classList.contains('active')) { btn.classList.remove('active'); subCategoryPanel.classList.remove('active'); return; }
         tabBtns.forEach(b => b.classList.remove('active')); btn.classList.add('active');
         unitList.innerHTML = ''; 

         const type = btn.getAttribute('data-type');
         unitData[type].forEach(unit => {
             const unitBtn = document.createElement('button');
             unitBtn.className = 'btn'; unitBtn.style.background = '#2980b9'; unitBtn.textContent = unit.name;
             unitBtn.onclick = () => { try { if (typeof selectBySubType === 'function') selectBySubType(unit.id); } catch(e) {} };
             unitList.appendChild(unitBtn);
         });
         subCategoryPanel.classList.add('active');
     });
 });

 window.deselectAllUI = function() {
     try { if (typeof deselectAll === 'function') deselectAll(); } catch(e) {}
     window.updateUISelectionState(false);
 };

 window.handleDirectionCommand = function(angle) {
     if (!window.currentSquads) return;
     for (let sq of window.currentSquads) {
         if (sq.selected && sq.team === 'ally') {
             sq.angle = angle; sq.waypoints = []; sq.targetSquad = null; 
         }
     }
 };

 // [수동 공격(강제 어택) 처리 함수]
 window.handleAttackCommand = function(pos) {
     if (!window.currentSquads) return;
     let allies = window.currentSquads.filter(sq => sq.selected && sq.team === 'ally');
     if (allies.length === 0) return;

     // 터치한 위치 근처(반경 60px 내)에 있는 적 부대 찾기
     let targetEnemy = window.currentSquads.find(sq => 
         sq.team === 'enemy' && 
         Math.hypot(sq.centerX - pos.x, sq.centerY - pos.y) < 60
     );

     if (targetEnemy) {
         // 적을 클릭했다면 타겟을 고정하고 강제 공격 모드로 전환
         allies.forEach(sq => {
             sq.targetSquad = targetEnemy;
             sq.waypoints = []; 
             sq.state = 'combat';
         });
     } else {
         // 맨땅을 클릭했다면 해당 위치로 어택땅(이동)
         allies.forEach(sq => {
             sq.targetSquad = null;
             sq.waypoints = [{x: pos.x, y: pos.y, width: sq.formationWidth, angle: sq.angle}];
         });
     }
     
     // 명령 수행 후 이동 모드로 자동 복귀
     if (window.setCommandMode) window.setCommandMode('move');
 };

 // [외교 (LLM) 모듈]
 (() => {
 const diploModal = document.getElementById('diplomacyModal');
 const diploChatBox = document.getElementById('diploChatBox');
 const diploInput = document.getElementById('diploInput');
 const DIPLOMACY_RULES = Object.freeze({
     FOOD_VALUE:25,LORD_SURVIVAL_VALUE:2000,UNIT_PRESERVATION_VALUE:20,
     TERRITORY_RISK_HIGH:3000,TERRITORY_RISK_MEDIUM:1500,

             if(typeof GEMINI_API_KEY==='string'&&GEMINI_API_KEY.trim()){
                 const history=session.history.slice(-DIPLOMACY_RULES.HISTORY_MAX_MESSAGES).map(x=>`${x.role}: ${x.text}`).join('\n');
                 const promptData={contents:[{parts:[{text:`[시스템] 내부 판정은 이미 확정됐다. 행동을 바꾸지 말고 감정과 대사만 JSON으로 답하라.\n확정 행동: ${decision.action}\n판정 사유: ${decision.reason}\n제안 금화: ${decision.offer.gold||0}\n제안 식량: ${decision.offer.food||0}\n거래 성립: ${decision.action==='negotiated_retreat'}\n응답 형식: {"emotion":"문자열","dialogue":"문자열"}\n최근 대화:\n${history}`}]}],generationConfig:{responseMimeType:'application/json'}};
                 const response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(promptData)});
                 if(!response.ok)throw new Error(`AI HTTP ${response.status}`);const data=await response.json();const text=data?.candidates?.[0]?.content?.parts?.[0]?.text;if(!text)throw new Error('invalid_ai_response');ai=normalizeAiDialogue(JSON.parse(text.replace(/```json/gi,'').replace(/```/g,'').trim()),decision);
             }else aiFailed=true;
         }catch(error){aiFailed=true;ai=defaultDialogue(decision,true);console.error('외교 AI 통신 실패:',error);}
         const loading=document.getElementById(loadingId);if(loading)loading.remove();loadingId=null;
         const discarded=!stateMatches(session,request)||decision.reason==='battle_already_terminal';
         if(discarded){emitResultDiagnostic(decision,{ok:false,tradeApplied:false,reason:'state_changed_or_terminal'},aiFailed,true,'none','#e67e22');appendNotice('[외교 응답 무효] 전장 상태가 바뀌어 이번 응답을 적용하지 않았습니다. 다시 시도해 주세요.','#e67e22');return;}
         let applied={ok:true,action:decision.action,reason:decision.reason,tradeApplied:false};
         if(decision.action==='negotiated_retreat'||decision.action==='strategic_retreat')applied=applyTerminalTransaction(session,decision);
         else if(decision.action==='attack')session.currentSquadsRef.filter(s=>s.team==='enemy').forEach(s=>{s.aiRole='flanker';});
         const shown=applied.ok?ai:defaultDialogue({action:'negotiate'},false);let uiWarning='none';
         try{
             appendDecision(shown);session.history.push({role:'lord',text:shown.dialogue});session.history=session.history.slice(-DIPLOMACY_RULES.HISTORY_MAX_MESSAGES);
             if(applied.ok&&(decision.action==='negotiated_retreat'||decision.action==='strategic_retreat')){
                 window.isGameOver=true;if(window.gameManager)window.gameManager.setTimeScale(0);diploModal.classList.remove('active');diploModal.style.display='none';if(window.updateEconUI)window.updateEconUI();if(window.returnToMainMenu)window.returnToMainMenu();
             }
         }catch(uiError){uiWarning='ui_postprocess_failed';console.error(uiWarning,uiError);}
         emitResultDiagnostic(decision,applied,aiFailed,false,uiWarning,applied.ok?'#f1c40f':'#e74c3c');session.lastResult={decision:clone(decision),applied:clone(applied),aiFailed,uiWarning};
     }catch(error){try{appendNotice(`[외교 처리 실패] ${String(error.message||error)}`,'#e74c3c');}catch(_){}}
     finally{if(loadingId){const loading=document.getElementById(loadingId);if(loading)loading.remove();}session.pending=false;try{diploChatBox.scrollTop=diploChatBox.scrollHeight;}catch(_){}}
 };
 window.executeRetreat=function(){dropdownContent.classList.remove('show');if(!window.currentSquads)return;alert('전군, 퇴각하라! 맵 끝으로 도주합니다.');window.currentSquads.forEach(sq=>{if(sq.team==='ally')sq.state='routing';});};
 const victoryAtomic= session => {
     const before={economy:economySnapshot(),storage:storageSnapshot(),isGameOver:window.isGameOver,terminalState:session?.terminalState??'open',terminalResult:session?.terminalResult??null};
     const enemyFleeing=(window.currentSquads||[]).filter(s=>s.team==='enemy'&&s.state==='routing').reduce((n,s)=>n+aliveUnitCount(s),0);
     const prisoners=Math.floor(enemyFleeing*0.4),lordCaptured=Math.random()<Math.min(0.5,enemyFleeing/50),goldLoot=1500+Math.floor(Math.random()*1000),territoryGained=1;
     try{
         if(session){session.terminalState='pending';session.terminalResult=null;}window.isGameOver=true;if(window.gameManager)window.gameManager.setTimeScale(0);
         window.playerEconomy.gold=Number(before.economy.gold)+goldLoot;window.playerEconomy.territory=Number(before.economy.territory||0)+territoryGained;window.playerEconomy.manpower=Number(before.economy.manpower||0)+prisoners;
         window.saveEconomy();const stored=storageEconomy();if(!stored||Number(stored.gold)!==Number(window.playerEconomy.gold)||Number(stored.territory)!==Number(window.playerEconomy.territory)||Number(stored.manpower)!==Number(window.playerEconomy.manpower))throw new Error('combat_victory_save_verification_failed');
         if(session){session.terminalResult='combat_victory';session.terminalState='final';if(!terminalPairValid(session))throw new Error('terminal_result_invalid');}
         return{ok:true,prisoners,lordCaptured,goldLoot,territoryGained};
     }catch(error){let restored=true;try{if(!restoreEconomy(before.economy,before.storage))restored=false;}catch(_){restored=false;}window.isGameOver=before.isGameOver;if(session){session.terminalState=before.terminalState;session.terminalResult=before.terminalResult;}if(!restored&&session)session.fatalLock=true;return{ok:false,error:String(error.message||error),fatalLock:!restored};}
 };
 window.checkBattleEnd=function(){
     const session=getSession();if(session&&lockInvalidTerminal(session))return;if(session&&session.fatalLock)return;if(session&&session.terminalState==='pending')return;
     if(session&&session.terminalState==='final'){if(session.terminalResult==='negotiated_retreat'||session.terminalResult==='strategic_retreat')window.isGameOver=true;return;}
     if(window.isPreparationPhase||window.isGameOver||!window.currentSquads)return;
     let allyActive=0,enemyActive=0,alliesRouting=0;
     for(const sq of window.currentSquads){const alive=aliveUnitCount(sq);if(sq.team==='ally'){if(sq.state==='routing')alliesRouting+=alive;else if(alive>0)allyActive+=alive;}else if(sq.team==='enemy'&&sq.state!=='routing'&&alive>0)enemyActive+=alive;}
     if(enemyActive===0){const result=victoryAtomic(session);if(!result.ok)return;const lordMsg=result.lordCaptured?'\n👑 적 영주를 생포했습니다! (막대한 몸값 요구 가능)':'\n💨 적 영주가 간신히 도망쳤습니다.';alert(`[전투 승리]\n전장을 지배했습니다!\n\n💰 전리품: 금화 ${result.goldLoot}\n🚩 점령한 영지: ${result.territoryGained}곳\n⛓️ 획득한 인력: ${result.prisoners}명${lordMsg}`);if(window.returnToMainMenu)window.returnToMainMenu();}
     else if(allyActive===0){window.isGameOver=true;if(window.gameManager)window.gameManager.setTimeScale(0);if(session){session.terminalState='final';session.terminalResult=alliesRouting>0?'player_retreat':'combat_defeat';}alert(alliesRouting>0?'[퇴각 완료]\n아군이 전장을 이탈했습니다.':'[전투 패배]\n아군이 모두 전멸하거나 흩어졌습니다... 영지를 빼앗겼습니다.');if(window.returnToMainMenu)window.returnToMainMenu();}
 };
 window.executeSurrender=function(){dropdownContent.classList.remove('show');if(confirm('정말 무기를 버리고 항복하시겠습니까? (즉시 패배)')){const session=getSession();if(session&&session.terminalState==='open'){session.terminalState='final';session.terminalResult='surrender';}alert('항복했습니다. 영주가 사로잡혔습니다.');location.reload();}};
 })(); </script>
