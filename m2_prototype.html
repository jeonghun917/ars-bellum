<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2630">
  <title>ARS BELLUM · 3D 전투</title>
  <link rel="stylesheet" href="m2_prototype.css">
  <!-- three.js add-ons (the model loader) import "three" by name; this points it at the same copy the battle uses. -->
  <script type="importmap">{ "imports": { "three": "./vendor/three/r184/three.module.min.js" } }</script>
</head>
<body>
  <main id="m2App" class="m2-app">
    <canvas id="m2Canvas" aria-label="20 대 20 3D 전투"></canvas>

    <section class="m2-header" aria-live="polite">
      <div>
        <div class="m2-kicker">전투 시험판 · 20 대 20</div>
        <h1>ARS BELLUM</h1>
      </div>
      <div id="m2Status" class="m2-status">초기화 중</div>
    </section>

    <!-- The player's latest blows and the blows at him (M2_Bootstrap.js showPlayerFeed). -->
    <div id="m2HitFeed" class="m2-hit-feed" aria-live="polite"></div>

    <section class="m2-controls m2-runtime-controls" aria-label="전투 진행">
      <button id="m2Start" type="button">시작</button>
      <button id="m2Pause" type="button">일시정지</button>
      <button id="m2Restart" type="button">재시작</button>
      <button id="m2Dispose" type="button" class="m2-dev-only">해제</button>
      <button id="m2DebugToggle" type="button" class="m2-dev-only" aria-pressed="false">진단</button>
    </section>

    <section class="m2-combat-controls" aria-label="플레이어 전투 제어">
      <button id="m2Attack" type="button">공격<kbd>J</kbd></button>
      <button id="m2Block" type="button" aria-pressed="false">방패<kbd>K</kbd></button>
      <button id="m2Bow" type="button" aria-label="무기 바꾸기">근접<kbd>L</kbd></button>
      <button id="m2Tactical" type="button">전술</button>
    </section>

    <section id="m2TacticalPanel" class="m2-tactical-panel" aria-label="전술 명령">
      <button id="m2PanelToggle" class="m2-panel-toggle" type="button" aria-expanded="true" aria-controls="m2PanelBody">
        <span>명령 · 전황</span>
        <span class="m2-panel-summary">아군 <b id="m2SummaryAlly">0</b> · 적군 <b id="m2SummaryEnemy">0</b></span>
      </button>
      <div id="m2PanelBody" class="m2-panel-body">
        <label>작전
          <select id="m2Plan"></select>
        </label>
        <label>아군
          <select id="m2FriendlyFormation"></select>
        </label>
        <label>적군
          <select id="m2EnemyFormation"></select>
        </label>
        <label>명령
          <select id="m2Tactic"></select>
        </label>
        <button id="m2AttackOrder" type="button">목표 공격</button>
        <div class="m2-button-row">
          <button id="m2Rally" type="button">재집결</button>
          <button id="m2Retreat" type="button">후퇴</button>
        </div>
        <button id="m2Pursuit" type="button" aria-pressed="false">추격: 끔</button>
        <div class="m2-stats">
          <div>아군 사기 <strong id="m2MoraleAlly">0</strong></div>
          <div>적군 사기 <strong id="m2MoraleEnemy">0</strong></div>
          <div>아군 도주 <strong id="m2RoutingAlly">0</strong></div>
          <div>적군 도주 <strong id="m2RoutingEnemy">0</strong></div>
          <div class="m2-stats-wide">결과 <strong id="m2Result">—</strong></div>
        </div>
        <div class="m2-button-row">
          <button id="m2Line" type="button">횡대<kbd>1</kbd></button>
          <button id="m2Column" type="button">종대<kbd>2</kbd></button>
          <button id="m2Loose" type="button">산개<kbd>3</kbd></button>
        </div>
        <div class="m2-button-row">
          <button id="m2ShieldWall" type="button">방패진<kbd>4</kbd></button>
          <button id="m2Wedge" type="button">쐐기진<kbd>5</kbd></button>
          <button id="m2Circle" type="button">원진<kbd>6</kbd></button>
        </div>
        <div class="m2-button-row m2-speed-row" aria-label="속도">
          <button id="m2Time0" type="button">정지</button>
          <button id="m2Time025" type="button">¼</button>
          <button id="m2Time05" type="button">½</button>
          <button id="m2Time1" type="button">1×</button>
        </div>
      </div>
    </section>

    <section id="m2VirtualStick" class="m2-virtual-stick" aria-label="가상 이동 스틱">
      <span></span>
    </section>

    <section class="m2-legend" aria-label="범례">
      <span><i class="ally"></i>아군</span>
      <span><i class="enemy"></i>적군</span>
      <span><i class="player"></i>나</span>
    </section>

    <pre id="m2Diagnostics" class="m2-diagnostics" hidden>진단 준비 중</pre>
    <noscript>이 페이지는 JavaScript가 필요합니다.</noscript>
  </main>

  <script type="module" src="m2/M2_Bootstrap.js"></script>
</body>
</html>
