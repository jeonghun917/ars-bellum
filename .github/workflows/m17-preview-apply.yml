name: M1-7 browser gate preview

on:
  push:
    branches:
      - m1-7-browser-gate

permissions:
  contents: write

jobs:
  apply-m1-7-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact M1-7 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .m17/part0.b64 .m17/part1.b64 .m17/part2.b64 .m17/part3.b64 | base64 -d > /tmp/M1_7_IMPLEMENTATION.patch.gz
          printf '%s  %s\n' 'f16eaa9d78ead3e108c8bcfc22dd7ddfc7e31bb4ee524571ff31cb6c4dd8cd92' '/tmp/M1_7_IMPLEMENTATION.patch.gz' | sha256sum -c -
          gzip -dc /tmp/M1_7_IMPLEMENTATION.patch.gz > /tmp/M1_7_IMPLEMENTATION.patch
          git apply --check /tmp/M1_7_IMPLEMENTATION.patch
          git apply /tmp/M1_7_IMPLEMENTATION.patch
          rm -rf .m17
          rm -f .github/workflows/m17-preview-apply.yml
          node verify.mjs
          for file in M1_CharActivity.js M1_CharState.js M1_ClanState.js M1_FactionState.js M1_Followups.js M1_LandRights.js M1_Memories.js M1_PlayerControl.js M1_Relations.js M1_TitleState.js; do
            node --check "$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No M1-7 changes produced'; exit 1; }
          git commit -m "test: prepare M1-7 browser gate preview"
          git push origin HEAD:m1-7-browser-gate
