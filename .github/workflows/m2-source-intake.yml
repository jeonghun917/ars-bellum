name: M2-0 Source Intake

on:
  push:
    branches:
      - m2/3d-tech-prototype-v1
    paths:
      - m2/source-intake/M2_0_SOURCE_BUNDLE.tgz.b64

permissions:
  contents: write

concurrency:
  group: m2-zero-source-intake
  cancel-in-progress: false

jobs:
  apply-source-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M2 branch
        uses: actions/checkout@v4
        with:
          ref: m2/3d-tech-prototype-v1
          fetch-depth: 0

      - name: Verify and unpack approved source bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="m2/source-intake/M2_0_SOURCE_BUNDLE.tgz.b64"
          archive="${RUNNER_TEMP}/M2_0_SOURCE_BUNDLE.tgz"
          test -f "$bundle"
          base64 --decode "$bundle" > "$archive"
          echo "2a669ad7169d99193a6d211fde678ad4ec2f7bfeb09bd2290bb66c08e8bc1a17  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C .
          rm -f "$bundle"
          rmdir m2/source-intake 2>/dev/null || true
          rm -f .github/workflows/m2-source-intake.yml
          rm -f .github/workflows/m2-vendor-intake.yml

      - name: Verify M1 and M2 source
        shell: bash
        run: |
          set -euo pipefail
          node verify.mjs
          node m2_verify.mjs

      - name: Commit M2-0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement isolated M2-0 3D runtime"
          git push origin HEAD:m2/3d-tech-prototype-v1
