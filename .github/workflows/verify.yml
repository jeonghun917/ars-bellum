name: Verify ARS BELLUM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source
        run: node verify.mjs
      - name: 2D battle checks
        run: node --test tests/unit/battle2d-sim.test.mjs tests/unit/battle2d-battle.test.mjs tests/unit/ui-battle.test.mjs
