name: Apply private diplomacy reset correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-private-diplomacy-reset.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '<button class="menu-btn btn-practice" onclick="resetDiplomacyForNewBattle(); startPracticeMode()">🎲 연습장</button>':
              '<button id="btn-practice-mode" class="menu-btn btn-practice">🎲 연습장</button>',
              '<button class="menu-btn btn-maingame" onclick="resetDiplomacyForNewBattle(); startMainGameMode()">🏰 본게임</button>':
              '<button id="btn-main-game-mode" class="menu-btn btn-maingame">🏰 본게임</button>',
              ' window.resetDiplomacyForNewBattle=function(){':
              ' const resetDiplomacyForNewBattle=()=>{',
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'exact replacement count failed: {old[:50]!r}, count={text.count(old)}')
              text = text.replace(old, new, 1)

          anchor = '''     diploChatBox.innerHTML='<div class="lord-msg">"감히 내 영지에 발을 들이다니, 목숨이 아깝지 않은 모양이군. 할 말이 있다면 들어나 보겠다."</div>';
 };
 window.openDiplomacy=function()'''
          replacement = '''     diploChatBox.innerHTML='<div class="lord-msg">"감히 내 영지에 발을 들이다니, 목숨이 아깝지 않은 모양이군. 할 말이 있다면 들어나 보겠다."</div>';
 };
 const practiceModeButton=document.getElementById('btn-practice-mode');
 const mainGameModeButton=document.getElementById('btn-main-game-mode');
 if(practiceModeButton)practiceModeButton.addEventListener('click',()=>{resetDiplomacyForNewBattle();if(typeof window.startPracticeMode==='function')window.startPracticeMode();});
 if(mainGameModeButton)mainGameModeButton.addEventListener('click',()=>{resetDiplomacyForNewBattle();if(typeof window.startMainGameMode==='function')window.startMainGameMode();});
 window.openDiplomacy=function()'''
          if text.count(anchor) != 1:
              raise SystemExit(f'listener insertion anchor count failed: {text.count(anchor)}')
          text = text.replace(anchor, replacement, 1)

          if 'window.resetDiplomacyForNewBattle' in text:
              raise SystemExit('public reset helper remains')
          if text.count('const resetDiplomacyForNewBattle=()=>{') != 1:
              raise SystemExit('private reset helper count invalid')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify source
        run: node verify.mjs
      - name: Commit correction and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/apply-private-diplomacy-reset.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-private-diplomacy-reset.yml
          git commit -m 'fix: keep diplomacy reset helper private'
          git push
