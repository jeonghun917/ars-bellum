name: Apply private diplomacy reset correction

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact correction
        run: python .github/scripts/apply_private_diplomacy_reset.py
      - name: Verify source
        run: node verify.mjs
      - name: Commit correction and remove one-time files
        shell: bash
        run: |
          rm .github/workflows/apply-private-diplomacy-reset.yml
          rm .github/scripts/apply_private_diplomacy_reset.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-private-diplomacy-reset.yml .github/scripts/apply_private_diplomacy_reset.py
          git commit -m 'fix: keep diplomacy reset helper private'
          git push
