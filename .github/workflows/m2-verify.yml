          sleep 1
          chrome_bin="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome_bin" ]; then
            printf '%s\n' '{"result":"NOT_TESTED","errorClassification":"chrome_binary_missing"}' > m2_browser_probe_result.json
          else
