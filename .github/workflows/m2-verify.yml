            chrome_pid=$!
            deadline=$((SECONDS+50))
            while [ ! -s m2_browser_probe_result.json ] && [ "$SECONDS" -lt "$deadline" ]; do
              if ! kill -0 "$chrome_pid" 2>/dev/null; then break; fi
              sleep .1
            done
            kill "$chrome_pid" 2>/dev/null || true
            wait "$chrome_pid" 2>/dev/null || true
            if [ ! -s m2_browser_probe_result.json ]; then
