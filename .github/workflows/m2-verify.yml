name: Verify ARS BELLUM M2
on:
  push:
    branches: [m2/20v20-vertical-slice-v1]
    paths: [m2_prototype.html,m2_prototype.css,m2/**,vendor/three/r184/**,m2_verify.mjs,.github/workflows/m2-verify.yml]
  pull_request:
    branches: [main]
permissions: {contents: read}
jobs:
  verify-m2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Guard artifact-only run evidence
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files -- m2_ci_browser_verification_result.json m2_ci_m1_verification_result.json m2_ci_verification_result.json)"
          test -z "$tracked" || { echo "$tracked" >&2; exit 1; }
      - name: Initialize run-bound identity
        shell: bash
        run: |
          set -euo pipefail
          rm -f m2_ci_*_verification_result.json m2_browser_probe_result.json
          echo "M2_TESTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify M1 baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e; node verify.mjs > m1.log 2>&1; code=$?; set -e; export CODE="$code"
          python3 <<'PY'
          import json,os,datetime;from pathlib import Path
          try:r=json.loads(Path('m1.log').read_text())
          except Exception as e:r={'status':'UNPARSEABLE','error':str(e)}
          ok=os.environ['CODE']=='0' and r.get('status')=='PASS'
          out={'testedHead':os.environ['M2_TESTED_HEAD'],'workflowRunId':os.environ['GITHUB_RUN_ID'],'workflowRunAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'scope':'M2_1_03_M1_REGRESSION','generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'result':'PASS' if ok else 'FAIL','rawResult':r}
          Path('m2_ci_m1_verification_result.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out,indent=2));raise SystemExit(0 if ok else 1)
          PY
      - name: Verify M2 static and deterministic
        shell: bash
        run: |
          set -euo pipefail
          set +e; node m2_verify.mjs > m2.log 2>&1; code=$?; set -e; export CODE="$code"
          python3 <<'PY'
          import json,os,datetime;from pathlib import Path
          r=json.loads(Path('m2_verification_result.json').read_text()) if Path('m2_verification_result.json').exists() else {'status':'MISSING'}
          ok=os.environ['CODE']=='0' and r.get('status')=='PASS' and r.get('phase')=='M2-1/03'
          out={'testedHead':os.environ['M2_TESTED_HEAD'],'workflowRunId':os.environ['GITHUB_RUN_ID'],'workflowRunAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'scope':'M2_1_03_STATIC_DETERMINISTIC','generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'result':'PASS' if ok else 'FAIL','rawResult':r}
          Path('m2_ci_verification_result.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out,indent=2));raise SystemExit(0 if ok else 1)
          PY
      - name: Verify actual m2_prototype Chrome WebGL2
        shell: bash
        run: |
          set -euo pipefail
          cat > m2_browser_harness.html <<'HTML'
