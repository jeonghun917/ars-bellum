name: Verify ARS BELLUM M2

on:
  push:
    branches:
      - m2/20v20-vertical-slice-v1
    paths:
      - m2_prototype.html
      - m2_prototype.css
      - m2/**
      - vendor/three/r184/**
      - m2_verify.mjs
      - .github/workflows/m2-verify.yml
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-m2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Guard artifact-only run evidence
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files -- m2_ci_browser_verification_result.json m2_ci_m1_verification_result.json m2_ci_verification_result.json)"
          if [ -n "$tracked" ]; then
            printf '%s\n' "Tracked run-result evidence is prohibited:" "$tracked" >&2
            exit 1
          fi

      - name: Initialize run-bound identity
        shell: bash
        run: |
          set -euo pipefail
          rm -f m2_ci_m1_verification_result.json m2_ci_verification_result.json m2_ci_browser_verification_result.json
          tested_head="$(git rev-parse HEAD)"
          printf 'M2_TESTED_HEAD=%s\n' "$tested_head" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify M1 baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node verify.mjs > m2_m1_raw.log 2>&1
          exit_code=$?
          set -e
          export RAW_EXIT="$exit_code"
          python3 <<'PY'
          import datetime, json, os
          from pathlib import Path
          raw = Path("m2_m1_raw.log").read_text(encoding="utf-8", errors="replace")
          try:
              raw_result = json.loads(raw)
          except Exception as exc:
              raw_result = {"status": "UNPARSEABLE", "error": str(exc), "rawText": raw}
          passed = os.environ["RAW_EXIT"] == "0" and isinstance(raw_result, dict) and raw_result.get("status") == "PASS"
          result = {
              "testedHead": os.environ["M2_TESTED_HEAD"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "scope": "M2_1_02_M1_REGRESSION",
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z"),
              "result": "PASS" if passed else "FAIL",
              "rawResult": raw_result,
          }
          Path("m2_ci_m1_verification_result.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          if not passed:
              raise SystemExit(1)
          PY
          exit "$exit_code"

      - name: Verify M2 static and deterministic
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node m2_verify.mjs > m2_raw.log 2>&1
          exit_code=$?
          set -e
          export RAW_EXIT="$exit_code"
          python3 <<'PY'
          import datetime, json, os
          from pathlib import Path
          raw_json = {}
          result_path = Path("m2_verification_result.json")
          if result_path.exists():
              raw_json = json.loads(result_path.read_text(encoding="utf-8"))
          result = {
              "testedHead": os.environ["M2_TESTED_HEAD"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "scope": "M2_1_02_STATIC_DETERMINISTIC",
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z"),
              "result": "PASS" if os.environ["RAW_EXIT"] == "0" else "FAIL",
              "rawResult": raw_json,
          }
          Path("m2_ci_verification_result.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2))
          PY
          exit "$exit_code"

      - name: Verify actual m2_prototype Chrome WebGL2
        shell: bash
        run: |
          set -euo pipefail
          rm -f m2_browser_probe_result.json
          cat > m2_browser_harness.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>M2-1/02 browser harness</title>
          <iframe id="prototype" src="/m2_prototype.html" style="width:1280px;height:720px;border:0"></iframe>
          <script type="module">
          const observations = {};
          const parentErrors = [];
          const parentRejections = [];
          addEventListener("error", e => parentErrors.push(String(e.message || "error")));
          addEventListener("unhandledrejection", e => parentRejections.push(String(e.reason || "rejection")));
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const clone = value => JSON.parse(JSON.stringify(value));
          const assert = (condition, name, detail = null) => {
            observations[name] = { pass: Boolean(condition), detail };
            if (!condition) throw new Error(name);
          };
          const sameXZ = (a, b, epsilon = 1e-9) => Boolean(a && b) && Math.abs(a.x - b.x) <= epsilon && Math.abs(a.z - b.z) <= epsilon;
          const differentXZ = (a, b, epsilon = 1e-4) => Boolean(a && b) && Math.hypot(a.x - b.x, a.z - b.z) > epsilon;
          
          const frame = document.getElementById("prototype");
          await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(new Error("prototype_load_timeout")), 15000);
            frame.addEventListener("load", () => { clearTimeout(timeout); resolve(); }, { once: true });
          });
          const w = frame.contentWindow;
          const d = frame.contentDocument;
          const frameErrors = [];
          const frameRejections = [];
          w.addEventListener("error", e => frameErrors.push(String(e.message || "error")));
          w.addEventListener("unhandledrejection", e => frameRejections.push(String(e.reason || "rejection")));
          for (let i = 0; i < 100 && (!w.ArsM2Battle || !w.ArsM2Diagnostics); i += 1) await sleep(50);
          assert(Boolean(w.ArsM2Battle && w.ArsM2Diagnostics), "BROWSER_API_READY");
          
          const dispatchPointer = (element, type, init = {}) => {
            element.dispatchEvent(new w.PointerEvent(type, {
              bubbles: true,
              cancelable: true,
              pointerId: init.pointerId ?? 1,
              pointerType: init.pointerType ?? "mouse",
              clientX: init.clientX ?? 0,
              clientY: init.clientY ?? 0,
              button: init.button ?? 0,
              buttons: init.buttons ?? (type === "pointerup" ? 0 : 1)
            }));
          };
          const tapPointer = (element, init = {}) => {
            dispatchPointer(element, "pointerdown", init);
            dispatchPointer(element, "pointerup", init);
          };
          const waitTicks = async (count = 1) => {
            const start = w.ArsM2Diagnostics.getSnapshot().fixedTickCount;
            for (let i = 0; i < 240 && w.ArsM2Diagnostics.getSnapshot().fixedTickCount < start + count; i += 1) await sleep(25);
            const end = w.ArsM2Diagnostics.getSnapshot().fixedTickCount;
            if (end < start + count) throw new Error(`tick_wait_timeout:${start}:${count}:${end}`);
          };
          const unit = unitId => w.ArsM2Battle.getSnapshot()?.units?.find(entry => entry.unitId === unitId) || null;
          const formation = formationId => w.ArsM2Battle.getSnapshot()?.formations?.find(entry => entry.formationId === formationId) || null;
          const ensureScale1 = () => w.ArsM2Battle.setTimeScale(1);
          const ensureMode = async mode => {
            if (w.ArsM2Diagnostics.getSnapshot().cameraMode === mode) return;
            tapPointer(d.getElementById("m2Tactical"), { pointerId: 501, pointerType: "touch" });
            await waitTicks(1);
            if (w.ArsM2Diagnostics.getSnapshot().cameraMode !== mode) throw new Error(`camera_mode_failed:${mode}`);
          };
          
          const { M2_TECHNICAL_SNAPSHOT } = await import("/m2/fixtures/m2_technical_fixture_v1.js");
          const makeDuelFixture = (enemyZ = 1.2) => {
            const fixture = clone(M2_TECHNICAL_SNAPSHOT);
            fixture.battleId = `m2_browser_duel_${String(enemyZ).replace(".", "_")}`;
            for (let index = 0; index < fixture.characters.length; index += 1) {
              const character = fixture.characters[index];
              const sign = character.sideId === "ally" ? -1 : 1;
              character.spawn = { x: sign * (28 + index), z: sign * (18 + index * 0.25), heading: character.sideId === "ally" ? 0 : Math.PI };
            }
            const player = fixture.characters.find(entry => entry.characterId === fixture.playerCharacterId);
            const enemy = fixture.characters.find(entry => entry.characterId === "m2_fixture_enemy_01");
            player.spawn = { x: 0, z: 0, heading: 0 };
            enemy.spawn = { x: 0, z: enemyZ, heading: Math.PI };
            for (const entry of fixture.formations) {
              entry.order = "hold";
              delete entry.target;
              if (entry.formationId === "ally_line") {
                entry.anchor = { x: -3.75, z: 0 };
                entry.facing = 0;
              } else if (entry.formationId === "enemy_line") {
                entry.anchor = { x: 3.75, z: enemyZ };
                entry.facing = 0;
              } else {
                const sign = entry.sideId === "ally" ? -1 : 1;
                entry.anchor = { x: sign * 32, z: sign * 24 };
              }
            }
            return fixture;
          };
          const loadFixture = async fixture => {
            ensureScale1();
            const receipt = w.ArsM2Battle.loadSnapshot(fixture);
            assert(receipt.ok, `LOAD_${fixture.battleId}`, receipt);
            await waitTicks(1);
            return w.ArsM2Battle.getSnapshot();
          };
          
          try {
            ensureScale1();
            await waitTicks(2);
            let snap = w.ArsM2Battle.getSnapshot();
            let diag = w.ArsM2Diagnostics.getSnapshot();
            const canvas = d.getElementById("m2Canvas");
            const liveWebGL2 = canvas.getContext("webgl2");
            assert(Boolean(liveWebGL2), "M21-02-BROWSER-001", { context: liveWebGL2 ? "webgl2" : null, lastError: diag.lastError });
            assert(snap.totalUnits === 40 && diag.renderedUnits === 40, "M21-02-BROWSER-002", { runtime: snap.totalUnits, rendered: diag.renderedUnits });
            assert(diag.cameraMode === "third_person" && diag.inputListenerCount > 0, "M21-02-BROWSER-003", { cameraMode: diag.cameraMode, inputListenerCount: diag.inputListenerCount });
          
            // B004: actual keyboard input queues command; authoritative position changes only after a fixed tick.
            const playerId = snap.playerCharacterId;
            const pos0 = clone(unit(playerId).position);
            w.dispatchEvent(new w.KeyboardEvent("keydown", { code: "KeyW", bubbles: true }));
            const immediate = clone(unit(playerId).position);
            await waitTicks(2);
            const moved = clone(unit(playerId).position);
            w.dispatchEvent(new w.KeyboardEvent("keyup", { code: "KeyW", bubbles: true }));
            await waitTicks(1);
            assert(sameXZ(pos0, immediate) && differentXZ(pos0, moved), "M21-02-BROWSER-004", { pos0, immediate, moved });
          
            // B005: actual ATTACK touch path against controlled in-range target must reduce HP by exact technical melee damage.
            await ensureMode("third_person");
            await loadFixture(makeDuelFixture(1.2));
            const meleeBefore = unit("m2_fixture_enemy_01").hp;
            dispatchPointer(d.getElementById("m2Attack"), "pointerdown", { pointerId: 601, pointerType: "touch" });
            const meleeImmediate = unit("m2_fixture_enemy_01").hp;
            await waitTicks(1);
            const meleeAfter = unit("m2_fixture_enemy_01").hp;
            dispatchPointer(d.getElementById("m2Attack"), "pointerup", { pointerId: 601, pointerType: "touch" });
            assert(meleeImmediate === meleeBefore && meleeBefore - meleeAfter === 10, "M21-02-BROWSER-005", { before: meleeBefore, immediate: meleeImmediate, after: meleeAfter, damage: meleeBefore - meleeAfter });
          
            // B006: same deterministic encounter, unblocked damage 10 vs actual BLOCK touch front damage 4.
            await loadFixture(makeDuelFixture(1.2));
            const playerHp0 = unit(playerId).hp;
            const unblockedOrder = w.ArsM2Battle.issueCommand({ commandId: "browser:block:unblocked", type: "formation_attack", formationId: "enemy_line", targetFormationId: "ally_line" });
            assert(unblockedOrder.ok, "BLOCK_UNBLOCKED_ORDER", unblockedOrder);
            await waitTicks(1);
            const unblockedDamage = playerHp0 - unit(playerId).hp;
          
            await loadFixture(makeDuelFixture(1.2));
            const blockedHp0 = unit(playerId).hp;
            dispatchPointer(d.getElementById("m2Block"), "pointerdown", { pointerId: 602, pointerType: "touch" });
            const blockedOrder = w.ArsM2Battle.issueCommand({ commandId: "browser:block:blocked", type: "formation_attack", formationId: "enemy_line", targetFormationId: "ally_line" });
            assert(blockedOrder.ok, "BLOCK_BLOCKED_ORDER", blockedOrder);
            await waitTicks(1);
            const blockingObserved = unit(playerId).blocking;
            const blockedDamage = blockedHp0 - unit(playerId).hp;
            dispatchPointer(d.getElementById("m2Block"), "pointerup", { pointerId: 602, pointerType: "touch" });
            await waitTicks(1);
            const releasedObserved = unit(playerId).blocking;
            assert(unblockedDamage === 10 && blockedDamage === 4 && blockedDamage < unblockedDamage && blockingObserved === true && releasedObserved === false, "M21-02-BROWSER-006", { unblockedDamage, blockedDamage, blockingObserved, releasedObserved });
          
            // B007: actual BOW touch path must launch and then show projectile progression or hit.
            await loadFixture(makeDuelFixture(4));
            const launch0 = w.ArsM2Diagnostics.getSnapshot().projectileLaunchCount;
            const hit0 = w.ArsM2Diagnostics.getSnapshot().projectileHitCount;
            dispatchPointer(d.getElementById("m2Bow"), "pointerdown", { pointerId: 603, pointerType: "touch" });
            await waitTicks(1);
            let bowDiag1 = w.ArsM2Diagnostics.getSnapshot();
            let bowSnap1 = w.ArsM2Battle.getSnapshot();
            const projectile1 = bowSnap1.projectiles?.[0] ? clone(bowSnap1.projectiles[0]) : null;
            await waitTicks(2);
            const bowDiag2 = w.ArsM2Diagnostics.getSnapshot();
            const bowSnap2 = w.ArsM2Battle.getSnapshot();
            const projectile2 = projectile1 ? bowSnap2.projectiles?.find(entry => entry.projectileId === projectile1.projectileId) || null : null;
            const progressed = Boolean(projectile1 && projectile2 && differentXZ(projectile1.position, projectile2.position));
            const hitObserved = bowDiag2.projectileHitCount > hit0;
            assert(bowDiag1.projectileLaunchCount > launch0 && (progressed || hitObserved), "M21-02-BROWSER-007", { launchBefore: launch0, launchAfter: bowDiag1.projectileLaunchCount, progressed, hitObserved, active1: bowDiag1.activeProjectileCount, active2: bowDiag2.activeProjectileCount });
          
            // B008: mode changes increment revision; old pending UI commands are stale, new release commands apply at next fixed tick.
            await loadFixture(clone(M2_TECHNICAL_SNAPSHOT));
            await ensureMode("third_person");
            const rev0 = w.ArsM2Diagnostics.getSnapshot().inputContextRevision;
            const stale0 = w.ArsM2Diagnostics.getSnapshot().staleInputCommandsDropped;
            w.dispatchEvent(new w.KeyboardEvent("keydown", { code: "KeyW", bubbles: true }));
            w.dispatchEvent(new w.KeyboardEvent("keydown", { code: "KeyK", bubbles: true }));
            tapPointer(d.getElementById("m2Tactical"), { pointerId: 604, pointerType: "touch" });
            const tacticalRev = w.ArsM2Diagnostics.getSnapshot().inputContextRevision;
            await waitTicks(1);
            const tacticalState = unit(playerId);
            const stale1 = w.ArsM2Diagnostics.getSnapshot().staleInputCommandsDropped;
            tapPointer(d.getElementById("m2Tactical"), { pointerId: 605, pointerType: "touch" });
            const thirdRev = w.ArsM2Diagnostics.getSnapshot().inputContextRevision;
            await waitTicks(1);
            const thirdState = unit(playerId);
            assert(
              tacticalRev === rev0 + 1 && thirdRev === tacticalRev + 1 &&
              stale1 >= stale0 + 2 &&
              tacticalState.blocking === false && sameXZ(tacticalState.directMoveIntent, { x: 0, z: 0 }) &&
              thirdState.blocking === false && sameXZ(thirdState.directMoveIntent, { x: 0, z: 0 }) &&
              w.ArsM2Battle.getSnapshot().totalUnits === 40,
              "M21-02-BROWSER-008",
              { rev0, tacticalRev, thirdRev, stale0, stale1, tacticalMove: tacticalState.directMoveIntent, thirdMove: thirdState.directMoveIntent }
            );
          
            // Enter tactical for formation UI tests.
            await ensureMode("tactical");
            const friendly = d.getElementById("m2FriendlyFormation");
            const enemy = d.getElementById("m2EnemyFormation");
            assert(Boolean(friendly.value && enemy.value), "FORMATION_SELECTION_READY", { friendly: friendly.value, enemy: enemy.value });
          
            // B009: actual ground pointer must become formation_move and later move a member.
            const selectedFormation = friendly.value;
            const selectedMember = formation(selectedFormation).activeMemberUnitIds[0];
            const groundBefore = clone(unit(selectedMember).position);
            const canvasRect = canvas.getBoundingClientRect();
            const groundPoint = { clientX: canvasRect.left + canvasRect.width * 0.68, clientY: canvasRect.top + canvasRect.height * 0.56, pointerId: 701, pointerType: "mouse" };
            tapPointer(canvas, groundPoint);
            await waitTicks(1);
            const groundOrder = clone(formation(selectedFormation).order);
            await waitTicks(3);
            const groundAfter = clone(unit(selectedMember).position);
            assert(groundOrder.type === "move" && Boolean(groundOrder.target) && differentXZ(groundBefore, groundAfter), "M21-02-BROWSER-009", { selectedFormation, groundOrder, groundBefore, groundAfter });
          
            // B010: actual attack-order control.
            tapPointer(d.getElementById("m2AttackOrder"), { pointerId: 702, pointerType: "touch" });
            await waitTicks(1);
            const attackOrder = clone(formation(friendly.value).order);
            assert(attackOrder.type === "attack_target" && attackOrder.targetFormationId === enemy.value, "M21-02-BROWSER-010", attackOrder);
          
            // B011: actual LINE/COLUMN/LOOSE controls.
            for (const [id, type] of [["m2Line", "line"], ["m2Column", "column"], ["m2Loose", "loose"]]) {
              tapPointer(d.getElementById(id), { pointerId: 710 + type.length, pointerType: "touch" });
              await waitTicks(2);
              const current = formation(friendly.value);
              assert(current.formationTypeId === type && frameErrors.length === 0 && frameRejections.length === 0, `M21-02-BROWSER-011-${type}`, { formationTypeId: current.formationTypeId });
            }
            observations["M21-02-BROWSER-011"] = { pass: true, detail: { line: true, column: true, loose: true } };
          
            // B012: time-scale matrix; only 0 is required to stay fixed in wall-clock observation.
            const timeObservations = {};
            for (const [id, scale] of [["m2Time0", 0], ["m2Time025", 0.25], ["m2Time05", 0.5], ["m2Time1", 1]]) {
              tapPointer(d.getElementById(id), { pointerId: 720 + Math.round(scale * 10), pointerType: "touch" });
              const before = w.ArsM2Diagnostics.getSnapshot().fixedTickCount;
              await sleep(scale === 0 ? 250 : 450);
              const after = w.ArsM2Diagnostics.getSnapshot().fixedTickCount;
              timeObservations[String(scale)] = { before, after };
              if (scale === 0) assert(after === before, `TIME_SCALE_${scale}`, { before, after });
              else assert(after > before, `TIME_SCALE_${scale}`, { before, after });
            }
            observations["M21-02-BROWSER-012"] = { pass: true, detail: timeObservations };
            ensureScale1();
          
            // B013: touch virtual stick, right drag, two-touch pinch, touch buttons, and UI leakage zero.
            await loadFixture(clone(M2_TECHNICAL_SNAPSHOT));
            await ensureMode("third_person");
            const stick = d.getElementById("m2VirtualStick");
            const stickRect = stick.getBoundingClientRect();
            const mobileBefore = clone(unit(playerId).position);
            dispatchPointer(stick, "pointerdown", { pointerId: 801, pointerType: "touch", clientX: stickRect.left + stickRect.width / 2, clientY: stickRect.top + stickRect.height / 2 });
            dispatchPointer(stick, "pointermove", { pointerId: 801, pointerType: "touch", clientX: stickRect.right - 3, clientY: stickRect.top + stickRect.height / 2 });
            await waitTicks(2);
            const mobileMoved = clone(unit(playerId).position);
            dispatchPointer(stick, "pointerup", { pointerId: 801, pointerType: "touch", clientX: stickRect.right - 3, clientY: stickRect.top + stickRect.height / 2 });
            await waitTicks(1);
            assert(differentXZ(mobileBefore, mobileMoved), "MOBILE_STICK_MOVE", { mobileBefore, mobileMoved });
          
            await ensureMode("tactical");
            const mobileFormationId = d.getElementById("m2FriendlyFormation").value;
            const probePoint = { clientX: canvasRect.left + canvasRect.width * 0.73, clientY: canvasRect.top + canvasRect.height * 0.52, pointerType: "touch" };
            tapPointer(canvas, { ...probePoint, pointerId: 802 });
            await waitTicks(1);
            const rayTarget0 = clone(formation(mobileFormationId).order.target);
          
            dispatchPointer(canvas, "pointerdown", { clientX: canvasRect.left + 500, clientY: canvasRect.top + 300, pointerId: 803, pointerType: "touch", button: 0, buttons: 1 });
            dispatchPointer(canvas, "pointermove", { clientX: canvasRect.left + 620, clientY: canvasRect.top + 300, pointerId: 803, pointerType: "touch", button: 0, buttons: 1 });
            dispatchPointer(canvas, "pointerup", { clientX: canvasRect.left + 620, clientY: canvasRect.top + 300, pointerId: 803, pointerType: "touch", button: 0, buttons: 0 });
            tapPointer(canvas, { ...probePoint, pointerId: 804 });
            await waitTicks(1);
            const rayTargetAfterDrag = clone(formation(mobileFormationId).order.target);
          
            dispatchPointer(canvas, "pointerdown", { clientX: canvasRect.left + 450, clientY: canvasRect.top + 330, pointerId: 805, pointerType: "touch" });
            dispatchPointer(canvas, "pointerdown", { clientX: canvasRect.left + 550, clientY: canvasRect.top + 330, pointerId: 806, pointerType: "touch" });
            dispatchPointer(canvas, "pointermove", { clientX: canvasRect.left + 430, clientY: canvasRect.top + 330, pointerId: 805, pointerType: "touch" });
            dispatchPointer(canvas, "pointermove", { clientX: canvasRect.left + 575, clientY: canvasRect.top + 330, pointerId: 806, pointerType: "touch" });
            dispatchPointer(canvas, "pointerup", { clientX: canvasRect.left + 430, clientY: canvasRect.top + 330, pointerId: 805, pointerType: "touch", buttons: 0 });
            dispatchPointer(canvas, "pointerup", { clientX: canvasRect.left + 575, clientY: canvasRect.top + 330, pointerId: 806, pointerType: "touch", buttons: 0 });
            tapPointer(canvas, { ...probePoint, pointerId: 807 });
            await waitTicks(1);
            const rayTargetAfterPinch = clone(formation(mobileFormationId).order.target);
          
            const leakageBefore = clone(formation(mobileFormationId).order);
            tapPointer(d.getElementById("m2Attack"), { pointerId: 808, pointerType: "touch" });
            await waitTicks(1);
            const leakageAfter = clone(formation(mobileFormationId).order);
            const revisionBeforeTouchTactical = w.ArsM2Diagnostics.getSnapshot().inputContextRevision;
            tapPointer(d.getElementById("m2Tactical"), { pointerId: 809, pointerType: "touch" });
            await waitTicks(1);
            const revisionAfterTouchTactical = w.ArsM2Diagnostics.getSnapshot().inputContextRevision;
            assert(
              differentXZ(rayTarget0, rayTargetAfterDrag) && differentXZ(rayTargetAfterDrag, rayTargetAfterPinch) &&
              JSON.stringify(leakageBefore) === JSON.stringify(leakageAfter) &&
              revisionAfterTouchTactical === revisionBeforeTouchTactical + 1 &&
              w.ArsM2Diagnostics.getSnapshot().activePointerCount === 0,
              "M21-02-BROWSER-013",
              { rayTarget0, rayTargetAfterDrag, rayTargetAfterPinch, uiLeakage: JSON.stringify(leakageBefore) === JSON.stringify(leakageAfter), revisionBeforeTouchTactical, revisionAfterTouchTactical, activePointerCount: w.ArsM2Diagnostics.getSnapshot().activePointerCount }
            );
          
            // B014: make blocking authoritative, create pending old-revision input, then dispose and require total input cleanup/reset.
            await ensureMode("third_person");
            await loadFixture(makeDuelFixture(1.2));
            dispatchPointer(d.getElementById("m2Block"), "pointerdown", { pointerId: 901, pointerType: "touch" });
            await waitTicks(1);
            assert(unit(playerId).blocking === true, "CLEANUP_BLOCK_PRECONDITION", { blocking: unit(playerId).blocking });
            w.dispatchEvent(new w.KeyboardEvent("keydown", { code: "KeyW", bubbles: true }));
            tapPointer(d.getElementById("m2Tactical"), { pointerId: 902, pointerType: "touch" });
            const listenersBeforeDispose = w.ArsM2Diagnostics.getSnapshot().inputListenerCount;
            d.getElementById("m2Dispose").click();
            await sleep(80);
            const disposedDiag = w.ArsM2Diagnostics.getSnapshot();
            const disposedSnapshot = w.ArsM2Battle.getSnapshot();
