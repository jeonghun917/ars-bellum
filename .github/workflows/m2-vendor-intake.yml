name: M2 Three.js Vendor Intake

on:
  push:
    branches:
      - m2/3d-tech-prototype-v1
    paths:
      - .github/workflows/m2-vendor-intake.yml

permissions:
  contents: write

concurrency:
  group: m2-three-vendor-intake
  cancel-in-progress: false

jobs:
  pin-three-r184:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M2 branch
        uses: actions/checkout@v4
        with:
          ref: m2/3d-tech-prototype-v1
          fetch-depth: 0

      - name: Fetch official Three.js r184 files
        shell: bash
        run: |
          set -euo pipefail
          vendor_dir="vendor/three/r184"
          mkdir -p "$vendor_dir"

          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/mrdoob/three.js/r184/build/three.module.min.js" \
            --output "$vendor_dir/three.module.min.js"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/mrdoob/three.js/r184/build/three.core.min.js" \
            --output "$vendor_dir/three.core.min.js"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/mrdoob/three.js/r184/LICENSE" \
            --output "$vendor_dir/LICENSE"

          grep -F 'from"./three.core.min.js"' "$vendor_dir/three.module.min.js" >/dev/null
          grep -F 'const t="184"' "$vendor_dir/three.core.min.js" >/dev/null

          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = require('node:path');

          const root = path.join('vendor', 'three', 'r184');
          const files = ['three.module.min.js', 'three.core.min.js', 'LICENSE'];
          const records = files.map((name) => {
            const bytes = fs.readFileSync(path.join(root, name));
            return {
              path: name,
              size: bytes.length,
              sha256: crypto.createHash('sha256').update(bytes).digest('hex')
            };
          });
          const manifest = {
            schemaVersion: 'ars-bellum.m2-vendor-manifest.v1',
            library: 'three',
            release: 'r184',
            packageVersion: '0.184.0',
            sourceRepository: 'mrdoob/three.js',
            sourceTag: 'r184',
            runtimeNetworkImport: false,
            files: records
          };
          fs.writeFileSync(
            path.join(root, 'MANIFEST.json'),
            `${JSON.stringify(manifest, null, 2)}\n`,
            'utf8'
          );
          NODE

      - name: Commit pinned vendor files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/three/r184
          if git diff --cached --quiet; then
            echo "Vendor files already pinned."
            exit 0
          fi
          git commit -m "chore: pin Three.js r184 for M2"
          git push origin HEAD:m2/3d-tech-prototype-v1
