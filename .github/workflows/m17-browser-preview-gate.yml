name: M1-7 browser preview gate

on:
  push:
    branches:
      - m1-7-browser-gate
    paths:
      - .github/workflows/m17-browser-preview-gate.yml

permissions:
  contents: write

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/m17-pw
          mkdir -p /tmp/m17-pw
          cd /tmp/m17-pw
          npm init -y >/dev/null
          npm install playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium

      - name: Run direct Vercel Preview browser gate
        shell: bash
        env:
          M17_PREVIEW_URL: https://ars-bellum-dd37utftx-ashite1010-3572s-projects.vercel.app/?_vercel_share=OHRauaW7fQ8tA9VazwVMFk5ijPJO0hpA
        run: |
          set -euo pipefail
          mkdir -p .m17-browser-evidence
          cat > /tmp/m17-pw/browser_gate.js <<'NODE'
          const { chromium } = require('/tmp/m17-pw/node_modules/playwright');
          const fs = require('fs');

          (async () => {
            const pageErrors = [];
            const consoleMessages = [];
            const failedRequests = [];
            const httpErrors = [];
            const started = Date.now();
            let navigationStatus = null;
            let navigationOk = false;
            let navigationError = null;
            let state = null;
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1365, height: 900 } });
            const page = await context.newPage();
            page.on('pageerror', error => pageErrors.push(String(error)));
            page.on('console', message => consoleMessages.push({ type: message.type(), text: message.text() }));
            page.on('requestfailed', request => failedRequests.push({ url: request.url(), failure: request.failure() }));
            page.on('response', response => {
              if (response.status() >= 400) {
                httpErrors.push({ url: response.url(), status: response.status(), resourceType: response.request().resourceType() });
              }
            });
            try {
              const response = await page.goto(process.env.M17_PREVIEW_URL, { waitUntil: 'load', timeout: 60000 });
              navigationStatus = response ? response.status() : null;
              navigationOk = response ? response.ok() : false;
              await page.waitForTimeout(5000);
              state = await page.evaluate(() => {
                const names = [
                  'ArsRelationshipState', 'ArsRelationshipSystem',
                  'ArsMemoryState', 'ArsMemorySystem',
                  'ArsNpcActivityState', 'ArsNpcActivitySystem',
                  'ArsM1FollowupState', 'ArsM1FollowupSystem'
                ];
                const globals = {};
                for (const name of names) globals[name] = typeof window[name];
                const scripts = [...document.scripts].map(script => script.getAttribute('src')).filter(Boolean);
                const m17Scripts = scripts.filter(src => /^M1_(Relations|Memories|CharActivity|Followups)\.js(?:\?|$)/.test(src));
                return {
                  href: location.href,
                  title: document.title,
                  readyState: document.readyState,
                  bodyPresent: Boolean(document.body),
                  mainMenuPresent: Boolean(document.getElementById('main-menu')),
                  canvasPresent: Boolean(document.getElementById('battlefield')),
                  globals,
                  scriptCount: scripts.length,
                  m17Scripts,
                  m17ScriptCounts: Object.fromEntries(m17Scripts.map(src => [src, m17Scripts.filter(value => value === src).length]))
                };
              });
              await page.screenshot({ path: '.m17-browser-evidence/M17_BROWSER_001_preview.png', fullPage: true });
            } catch (error) {
              navigationError = String(error);
              try { await page.screenshot({ path: '.m17-browser-evidence/M17_BROWSER_001_preview.png', fullPage: true }); } catch (_) {}
            }
            const consoleErrors = consoleMessages.filter(message => message.type === 'error');
            const requiredGlobalsAccessible = Boolean(state) && Object.values(state.globals).every(type => type === 'object' || type === 'function');
            const exactScripts = Boolean(state) && JSON.stringify(state.m17Scripts) === JSON.stringify([
              'M1_Relations.js', 'M1_Memories.js', 'M1_CharActivity.js', 'M1_Followups.js'
            ]);
            const assertions = {
              http200: navigationStatus === 200 && navigationOk,
              documentComplete: Boolean(state) && state.readyState === 'complete',
              titleCorrect: Boolean(state) && state.title === 'Ars Bellum (아르스 벨룸)',
              requiredGlobalsAccessible,
              m17ScriptsExactOrderOnce: exactScripts && Object.values(state.m17ScriptCounts).every(count => count === 1),
              pageErrorCountZero: pageErrors.length === 0,
              consoleErrorCountZero: consoleErrors.length === 0,
              failedRequestCountZero: failedRequests.length === 0,
              httpErrorCountZero: httpErrors.length === 0
            };
            const result = {
              testId: 'M17-BROWSER-001',
              deploymentId: 'dpl_Us3QiV5WdbetfpMVp1Yfyh842yxJ',
              deploymentCommit: '40f42e7ba70d0ca1e2a8323d3e7f5f6e07e7f7b4',
              branch: 'm1-7-browser-gate',
              previewUrl: 'https://ars-bellum-dd37utftx-ashite1010-3572s-projects.vercel.app/',
              browser: 'Playwright Chromium 1.54.2 on GitHub Actions ubuntu-latest',
              navigationStatus,
              navigationOk,
              navigationError,
              elapsedMs: Date.now() - started,
              state,
              pageErrors,
              consoleErrors,
              consoleWarnings: consoleMessages.filter(message => message.type === 'warning'),
              failedRequests,
              httpErrors,
              assertions,
              status: Object.values(assertions).every(Boolean) ? 'PASS' : 'FAIL'
            };
            fs.writeFileSync('.m17-browser-evidence/M17_BROWSER_001_PREVIEW_RESULT.json', JSON.stringify(result, null, 2));
            fs.writeFileSync('.m17-browser-evidence/browser_console.json', JSON.stringify(consoleMessages, null, 2));
            await browser.close();
            console.log(JSON.stringify(result, null, 2));
          })().catch(error => {
            fs.mkdirSync('.m17-browser-evidence', { recursive: true });
            fs.writeFileSync('.m17-browser-evidence/M17_BROWSER_001_PREVIEW_RESULT.json', JSON.stringify({ testId: 'M17-BROWSER-001', status: 'FAIL', harnessError: String(error) }, null, 2));
            console.error(error);
          });
          NODE
          node /tmp/m17-pw/browser_gate.js
          if [ -f .m17-browser-evidence/M17_BROWSER_001_preview.png ]; then
            base64 -w0 .m17-browser-evidence/M17_BROWSER_001_preview.png > .m17-browser-evidence/M17_BROWSER_001_preview.png.b64
            rm .m17-browser-evidence/M17_BROWSER_001_preview.png
          fi

      - name: Record evidence and remove one-time workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/m17-browser-preview-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: record M1-7 browser preview gate evidence"
          git push origin HEAD:m1-7-browser-gate

      - name: Enforce browser gate
        if: always()
        shell: bash
        run: |
          node -e "const r=require('./.m17-browser-evidence/M17_BROWSER_001_PREVIEW_RESULT.json'); console.log(r); if(r.status!=='PASS') process.exit(1)"
